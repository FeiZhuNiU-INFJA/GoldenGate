# Conda env for extreme_quant (Apple Silicon / M1–M4 by default)
# Create:  conda env create -f environment.yml
# Update:  conda env update -f environment.yml --prune
# Activate: conda activate extreme_quant
#
# Channels use Tsinghua mirrors (国内加速). Alternatives:
#   中科大: https://mirrors.ustc.edu.cn/anaconda/...
#   阿里云: https://mirrors.aliyun.com/anaconda/...
#
# Apple Silicon: arm64 PyTorch builds include MPS (Metal) acceleration.
# Verify after install:
#   # Apple Silicon
#   python -c "import torch; print(torch.__version__, 'mps=', torch.backends.mps.is_available())"
#   # NVIDIA CUDA (Linux x86_64 example — install matching pytorch-cuda build)
#   # conda install pytorch pytorch-cuda=12.1 -c pytorch -c nvidia
#   python -c "import torch; print(torch.__version__, 'cuda=', torch.cuda.is_available(), torch.cuda.get_device_name(0) if torch.cuda.is_available() else '')"
#
name: extreme_quant
channels:
  - https://mirrors.tuna.tsinghua.edu.cn/anaconda/cloud/conda-forge
  - https://mirrors.tuna.tsinghua.edu.cn/anaconda/pkgs/main
  - https://mirrors.tuna.tsinghua.edu.cn/anaconda/pkgs/r
dependencies:
  - python=3.12
  - pip
  - numpy=1.26.*
  - pandas=2.2.*
  - pyarrow=16.*
  - scikit-learn=1.5.*
  - matplotlib=3.9.*
  - tqdm=4.66.*
  - pytest=8.*
  # conda-forge osx-arm64 pytorch includes MPS support
  - pytorch=2.4.*
  - pip:
      - --index-url=https://pypi.tuna.tsinghua.edu.cn/simple
      - --trusted-host=pypi.tuna.tsinghua.edu.cn
      - baostock>=0.8.8
      - yfinance>=0.2.40
      - akshare>=1.14.0,<2
      - beautifulsoup4>=4.12
      - lxml>=5.0
      - html5lib>=1.1
      - requests>=2.31
      - openpyxl>=3.1
